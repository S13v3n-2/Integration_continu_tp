[project]
name = "integration-continu-tp"
version = "0.1.0"
description = "Pipeline data : génération de CSV, traitement pandas et insertion dans PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
