name: integration_continue_tp
services:
  db:
    image: postgres:16-alpine
    restart: no
    # or set shared memory limit when deploy via swarm stack
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: chrislusf/seaweedfs:latest
    restart: no
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64
    ports:
      - "8333:8333"
    volumes:
      - ./data/s3:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:6.1.2
    restart: no
    ports:
      - 8888:8080
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m