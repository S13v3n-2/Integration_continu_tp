[project]
name = "integration-continu-tp"
version = "0.1.0"
description = "Pipeline data : génération de CSV, traitement pandas et insertion dans PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0",
    "boto3>=1.35",
    "pillow>=10.1",
    "psycopg[binary]>=3.2",
    "pytesseract>=0.3",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: necessite postgres et le S3 local"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
